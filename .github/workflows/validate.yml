name: Static checks and isolated tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Repository hygiene and syntax
        run: python3 tests/check_repository.py
      - name: Behavioral regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
